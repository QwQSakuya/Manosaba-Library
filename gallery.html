<style>
/* ═══════════════════════════════════════════════════
   CG画廊 页面专属样式
   依赖: shared.css + content.css
   ═══════════════════════════════════════════════════ */

/* ── 开屏: 相机光圈 (aperture) ── */
#splash-mark { color: var(--fg); }
.aperture-blade {
  fill: currentColor;
  transform-box: view-box;
  animation: apertureOpen 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
}
.aperture-ring {
  fill: none;
  stroke: currentColor;
  stroke-width: 1;
  opacity: 0.32;
}
.aperture-hub {
  fill: none;
  stroke: currentColor;
  stroke-width: 1;
  opacity: 0.4;
}
/* 六片光圈叶片从闭合(指向中心)旋转张开 */
@keyframes apertureOpen {
  from { transform: rotate(0deg); }
  to   { transform: rotate(70deg); }
}

/* ── 睁眼黑幕 (彩蛋跳转: 眼睑从中央向上下拉开) ── */
.eye-lid {
  position: fixed;
  left: 0; right: 0;
  z-index: 99999;
  background: #000;
  pointer-events: none;
}
.eye-lid.top    { top: 0; }
.eye-lid.bottom { bottom: 0; }
.eye-lid.opening { animation: lid-open 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes lid-open {
  0%   { height: 50vh; }
  100% { height: 0; }
}

/* ── 缩略图网格 ── */
.gallery-grid {
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}
@media (max-width: 720px) {
  .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
}

/* ── 相框卡片 (frame card) ── */
.frame-card {
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 6px;
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.35s ease,
              box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.frame-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 28px rgba(0,0,0,0.10);
}
/* 内层 matte (白边效果) */
.frame-matte {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 1px;
}
.frame-matte img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.frame-matte img.loaded { opacity: 1; }
/* 哥特角线装饰 (hover 显现) */
.frame-matte::before,
.frame-matte::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  border: 1px solid var(--accent);
  opacity: 0;
  pointer-events: none;
  z-index: 2;
  transition: opacity 0.35s ease;
}
.frame-matte::before { top: 3px; left: 3px; border-right: none; border-bottom: none; }
.frame-matte::after  { bottom: 3px; right: 3px; border-left: none; border-top: none; }
.frame-card:hover .frame-matte::before,
.frame-card:hover .frame-matte::after { opacity: 0.5; }
/* 卡片标题 */
.frame-title {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--fg3);
  text-align: center;
  padding: 5px 4px 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 胶片齿孔装饰 (网格两侧, 极淡) ── */
.c-main::before,
.c-main::after {
  content: '';
  position: absolute;
  top: 44px;
  bottom: 64px;
  width: 7px;
  background-image: repeating-linear-gradient(
    to bottom,
    var(--fg3) 0px, var(--fg3) 4px,
    transparent 4px, transparent 15px
  );
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}
.c-main::before { left: 7px; }
.c-main::after  { right: 7px; }
@media (max-width: 720px) {
  .c-main::before, .c-main::after { display: none; }
}

/* ── 灯箱计数器 ── */
.lightbox .lb-counter {
  position: absolute;
  top: 26px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.5);
  pointer-events: none;
}
.lightbox .lb-download {
  position: static;
  transform: none;
  padding: 8px 18px;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 999px;
  color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.35);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-decoration: none;
  backdrop-filter: blur(4px);
  transition: background 0.25s ease, color 0.25s ease;
}
.lightbox .lb-download:hover {
  background: rgba(255,255,255,0.9);
  color: #15121e;
}
.lightbox .lb-download-row {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 3;
}
.lightbox .lb-fmt {
  display: flex;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 999px;
  overflow: hidden;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
}
.lightbox .lb-fmt-btn {
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.6);
  font-family: "Cormorant Garamond", serif;
  font-size: 13px;
  letter-spacing: 0.08em;
  padding: 8px 14px;
  cursor: pointer;
  transition: background 0.25s ease, color 0.25s ease;
}
.lightbox .lb-fmt-btn.active {
  background: rgba(255,255,255,0.9);
  color: #15121e;
}
.lightbox .lb-fmt-btn.disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
/* 灯箱图片淡入 (叠加在 content.css 的 scale 过渡上) */
.lightbox img {
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
              opacity 0.3s ease;
}
@media (max-width: 720px) {
  .lightbox .lb-prev { left: 8px; }
  .lightbox .lb-next { right: 8px; }
  .lightbox .lb-nav { font-size: 36px; }
}

/* ── 减少动效 ── */
@media (prefers-reduced-motion: reduce) {
  .aperture-blade {
    animation: none !important;
    transform: rotate(70deg) !important;
  }
  .eye-lid.opening {
    animation: none !important;
    height: 0 !important;
  }
  .frame-card, .frame-matte::before, .frame-matte::after,
  .frame-matte img, .lightbox img {
    transition-duration: 0.01s !important;
  }
}
</style>
</head>
