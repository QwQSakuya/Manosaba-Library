<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">

<style>
/* ═══════════════════════════════════════════════════
   CG画廊 页面专属样式
   依赖: shared.css + content.css
   ═══════════════════════════════════════════════════ */

/* ── 开屏: 相机光圈 (aperture) ── */
#splash-mark { color: var(--fg); }
.aperture-blade {
  fill: currentColor;
  transform-box: view-box;
  animation: apertureOpen 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
}
.aperture-ring {
  fill: none;
  stroke: currentColor;
  stroke-width: 1;
  opacity: 0.32;
}
.aperture-hub {
  fill: none;
  stroke: currentColor;
  stroke-width: 1;
  opacity: 0.4;
}
/* 六片光圈叶片从闭合(指向中心)旋转张开 */
@keyframes apertureOpen {
  from { transform: rotate(0deg); }
  to   { transform: rotate(70deg); }
}

/* ── 睁眼黑幕 (彩蛋跳转: 眼睑从中央向上下拉开) ── */
.eye-lid {
  position: fixed;
  left: 0; right: 0;
  z-index: 99999;
  background: #000;
  pointer-events: none;
}
.eye-lid.top    { top: 0; }
.eye-lid.bottom { bottom: 0; }
.eye-lid.opening { animation: lid-open 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes lid-open {
  0%   { height: 50vh; }
  100% { height: 0; }
}

/* ── 缩略图网格 ── */
.gallery-grid {
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}
@media (max-width: 720px) {
  .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
}

/* ── 相框卡片 (frame card) ── */
.frame-card {
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 6px;
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.35s ease,
              box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.frame-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 28px rgba(0,0,0,0.10);
}
/* 内层 matte (白边效果) */
.frame-matte {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 1px;
}
.frame-matte img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.frame-matte img.loaded { opacity: 1; }
/* 哥特角线装饰 (hover 显现) */
.frame-matte::before,
.frame-matte::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  border: 1px solid var(--accent);
  opacity: 0;
  pointer-events: none;
  z-index: 2;
  transition: opacity 0.35s ease;
}
.frame-matte::before { top: 3px; left: 3px; border-right: none; border-bottom: none; }
.frame-matte::after  { bottom: 3px; right: 3px; border-left: none; border-top: none; }
.frame-card:hover .frame-matte::before,
.frame-card:hover .frame-matte::after { opacity: 0.5; }
/* 卡片标题 */
.frame-title {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--fg3);
  text-align: center;
  padding: 5px 4px 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 胶片齿孔装饰 (网格两侧, 极淡) ── */
.c-main::before,
.c-main::after {
  content: '';
  position: absolute;
  top: 44px;
  bottom: 64px;
  width: 7px;
  background-image: repeating-linear-gradient(
    to bottom,
    var(--fg3) 0px, var(--fg3) 4px,
    transparent 4px, transparent 15px
  );
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}
.c-main::before { left: 7px; }
.c-main::after  { right: 7px; }
@media (max-width: 720px) {
  .c-main::before, .c-main::after { display: none; }
}

/* ── 灯箱计数器 ── */
.lightbox .lb-counter {
  position: absolute;
  top: 26px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.5);
  pointer-events: none;
}
.lightbox .lb-download {
  position: static;
  transform: none;
  padding: 8px 18px;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 999px;
  color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.35);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-decoration: none;
  backdrop-filter: blur(4px);
  transition: background 0.25s ease, color 0.25s ease;
}
.lightbox .lb-download:hover {
  background: rgba(255,255,255,0.9);
  color: #15121e;
}
.lightbox .lb-download-row {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 3;
}
.lightbox .lb-fmt {
  display: flex;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 999px;
  overflow: hidden;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
}
.lightbox .lb-fmt-btn {
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.6);
  font-family: "Cormorant Garamond", serif;
  font-size: 13px;
  letter-spacing: 0.08em;
  padding: 8px 14px;
  cursor: pointer;
  transition: background 0.25s ease, color 0.25s ease;
}
.lightbox .lb-fmt-btn.active {
  background: rgba(255,255,255,0.9);
  color: #15121e;
}
.lightbox .lb-fmt-btn.disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
/* 灯箱图片淡入 (叠加在 content.css 的 scale 过渡上) */
.lightbox img {
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
              opacity 0.3s ease;
}
@media (max-width: 720px) {
  .lightbox .lb-prev { left: 8px; }
  .lightbox .lb-next { right: 8px; }
  .lightbox .lb-nav { font-size: 36px; }
}

/* ── 减少动效 ── */
@media (prefers-reduced-motion: reduce) {
  .aperture-blade {
    animation: none !important;
    transform: rotate(70deg) !important;
  }
  .eye-lid.opening {
    animation: none !important;
    height: 0 !important;
  }
  .frame-card, .frame-matte::before, .frame-matte::after,
  .frame-matte img, .lightbox img {
    transition-duration: 0.01s !important;
  }
}

/* ═══════════════════════════════════════════════════
   立绘工坊 — 重设计布局
   ═══════════════════════════════════════════════════ */

/* Tab Panel 显示/隐藏 */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 工坊三列网格 */
.ws-workshop {
  display: grid;
  grid-template-columns: 200px 1fr 290px;
  gap: 20px;
  align-items: start;
}
@media (max-width: 960px) {
  .ws-workshop { grid-template-columns: 1fr; }
}

/* 侧栏面板 */
.ws-sidebar {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 16px;
  position: relative;
}
.ws-sidebar-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.1em;
  margin: 0 0 12px;
  color: var(--fg);
}

/* 角色列表 */
.ws-char-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 560px;
  overflow-y: auto;
}
.ws-char {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  transition: border-color 0.25s, background 0.25s;
}
.ws-char:hover { border-color: var(--accent); }
.ws-char.active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.ws-char small { opacity: 0.55; font-size: 11px; }

/* 画布舞台 */
.ws-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.ws-canvas-frame {
  width: 100%;
  max-width: 560px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 420px;
  overflow: hidden;
  position: relative;
}
.ws-canvas-frame::before,
.ws-canvas-frame::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  border: 1px solid var(--fg3);
  opacity: 0.3;
  pointer-events: none;
  z-index: 2;
}
.ws-canvas-frame::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
.ws-canvas-frame::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }
.ws-canvas-frame canvas { width: 100%; height: auto; display: block; }

.ws-stage-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 560px;
  gap: 12px;
}
.ws-char-name {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.08em;
  color: var(--fg2);
}
.ws-download {
  padding: 9px 24px;
  border: 1px solid var(--accent);
  border-radius: 2px;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.1em;
  transition: opacity 0.25s;
  white-space: nowrap;
}
.ws-download:disabled { opacity: 0.4; cursor: wait; }

/* 控制面板 */
.ws-controls { display: flex; flex-direction: column; gap: 12px; }
.ws-field label {
  display: block;
  font-size: 12px;
  margin-bottom: 5px;
  opacity: 0.8;
  letter-spacing: 0.04em;
}
.ws-field select {
  width: 100%;
  padding: 7px 8px;
  background: var(--bg2);
  color: inherit;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 13px;
}
.ws-group {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
}
.ws-group h3 {
  font-size: 11px;
  margin: 0 0 6px;
  opacity: 0.6;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ws-part {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  padding: 2px 0;
  cursor: pointer;
}
.ws-part input { flex: none; }
.ws-mask-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  cursor: pointer;
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}
.ws-note {
  font-size: 11px;
  opacity: 0.55;
  line-height: 1.55;
  margin-top: 10px;
}

@media (max-width: 960px) {
  .ws-char-list { max-height: 200px; }
  .ws-stage-bar { flex-direction: column; gap: 8px; }
}

/* 工坊减少动效 */
@media (prefers-reduced-motion: reduce) {
  .ws-char, .ws-download, .ws-canvas-frame::before, .ws-canvas-frame::after {
    transition-duration: 0.01s !important;
  }
}
</style>
</head>
<body>

<!-- ═══ 开屏动画: 相机光圈 ═══ -->
<div id="splash">
  <div id="splash-mark">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle class="aperture-ring" cx="50" cy="50" r="46"/>
      <circle class="aperture-hub" cx="50" cy="50" r="6"/>
      <!-- 六片光圈叶片, 各自绕边缘支点旋转张开 -->
      <path class="aperture-blade" style="transform-origin:50px 10px"    d="M50,10 C42,22 42,38 50,50 C58,38 58,22 50,10 Z"/>
      <path class="aperture-blade" style="transform-origin:84.64px 30px" d="M84.64,30 C70.25,29.07 56.39,37.07 50,50 C64.39,50.93 78.25,42.93 84.64,30 Z"/>
      <path class="aperture-blade" style="transform-origin:84.64px 70px" d="M84.64,70 C78.25,57.07 64.39,49.07 50,50 C56.39,62.93 70.25,70.93 84.64,70 Z"/>
      <path class="aperture-blade" style="transform-origin:50px 90px"    d="M50,90 C58,78 58,62 50,50 C42,62 42,78 50,90 Z"/>
      <path class="aperture-blade" style="transform-origin:15.36px 70px" d="M15.36,70 C29.75,70.93 43.61,62.93 50,50 C35.61,49.07 21.75,57.07 15.36,70 Z"/>
      <path class="aperture-blade" style="transform-origin:15.36px 30px" d="M15.36,30 C21.75,42.93 35.61,50.93 50,50 C43.61,37.07 29.75,29.07 15.36,30 Z"/>
    </svg>
  </div>
  <h1 id="splash-title">绘像展厅</h1>
  <p id="splash-sub">Gallery &amp; Atelier</p>
  <div id="splash-bar"></div>
</div>

<!-- ═══ 背景装饰层 ═══ -->
<div id="bg-host"></div>

<!-- ═══ 主题切换 (右上角) ═══ -->
<button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>

    <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
  </svg>
</button>

<!-- ═══ 内容页头部 ═══ -->
<header class="c-header">
  <a href="index.html" class="nav-link">← 返回</a>
  <span class="c-title">绘像展厅</span>
  <span class="c-subtitle">Gallery &amp; Atelier</span>
  <div class="c-spacer"></div>
  <div class="c-search" id="gallery-search-wrap" style="display:none"><input type="search" id="gallery-search" placeholder="搜索CG标题..."></div>
</header>

<!-- ═══ Tab 栏: CG画廊 / 立绘工坊 ═══ -->
<div class="tabbar gallery-tabs">
  <button class="tab active" data-tab="gallery" type="button">CG画廊</button>
  <button class="tab" data-tab="workshop" type="button">立绘工坊</button>
</div>

<!-- ═══ 主体 ═══ -->
<main class="c-main">
  <!-- Tab 1: CG画廊 -->
  <div class="tab-panel active" id="panel-gallery">
    <div class="filterbar" id="gallery-filters"></div>
    <div class="card-grid gallery-grid" id="gallery-grid"></div>
  </div>

  <!-- Tab 2: 立绘工坊 -->

<!-- ═══ 灯箱 ═══ -->
<div class="lightbox" id="gallery-lightbox" aria-hidden="true">

    <div class="lb-fmt" role="group" aria-label="原图格式">
      <button type="button" class="lb-fmt-btn active" data-fmt="png">PNG</button>
      <button type="button" class="lb-fmt-btn" data-fmt="tga">TGA</button>
    </div>
  </div>
</div>
