<!DOCTYPE html>

<script>
  (function () {
    document.documentElement.classList.add('js');
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }

<style>
/* ═══ 404 — 查无此卷 · 审判台处刑意象 ═══ */
.nf-curtain {
  position: fixed;
  left: 0; right: 0;
  height: 50vh;
  z-index: 120;
  background: var(--veil-grad);
  pointer-events: none;
  display: none;
}
html.js .nf-curtain { display: block; }
.nf-curtain.top { top: 0; }
.nf-curtain.bottom { bottom: 0; }
.nf-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 48px 24px;
  text-align: center;
  position: relative;
  z-index: 1;
}
.nf-seal {
  width: 84px; height: 84px;
  color: var(--accent);
  opacity: 0.85;
  filter: drop-shadow(0 0 18px var(--glow-blood));
  margin-bottom: 6px;
}
.nf-seal svg { width: 100%; height: 100%; display: block; }
.nf-logo {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  opacity: 0;
  transform: translateY(14px);
  animation: enter-up 0.9s var(--ease-out-expo) 0.45s forwards;
}
.nf-eyebrow {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--fg2);
  margin: 0;
  opacity: 0;
  transform: translateY(12px);
  animation: enter-up 0.9s var(--ease-out-expo) 0.55s forwards;
}
.nf-code {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(84px, 18vw, 170px);
  line-height: 1;
  letter-spacing: 0.04em;
  color: var(--fg);
  margin: 8px 0 0;
  text-shadow:
    0 0 40px var(--glow-blood),
    0 0 90px var(--glow-blood),
    0 18px 50px rgba(0, 0, 0, 0.55);
  opacity: 0;
  transform: translateY(16px);
  animation: enter-up 0.95s var(--ease-out-expo) 0.7s forwards;
}
[data-theme="light"] .nf-code {
  text-shadow:
    0 0 40px hsla(340, 60%, 55%, 0.10),
    0 18px 50px rgba(0, 0, 0, 0.18);
}
.nf-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: clamp(20px, 4vw, 30px);
  letter-spacing: 0.24em;
  color: var(--fg);
  margin: 6px 0 0;
  position: relative;
  padding-left: 22px;
  opacity: 0;
  transform: translateY(14px);
  animation: enter-up 0.9s var(--ease-out-expo) 0.85s forwards;
}
.nf-title::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 26px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--glow-blood);
}
.nf-sub {
  font-size: 15px;
  line-height: 1.9;
  letter-spacing: 0.06em;
  color: var(--fg2);
  margin: 0;
  max-width: 560px;
  opacity: 0;
  transform: translateY(12px);
  animation: enter-up 0.9s var(--ease-out-expo) 1.0s forwards;
}
.nf-en {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--fg3);
  margin: 0;
  opacity: 0;
  transform: translateY(10px);
  animation: enter-up 0.9s var(--ease-out-expo) 1.1s forwards;
}
.nf-divider {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 6px 0 2px;
  animation: enter-divider 0.85s var(--ease-out-expo) 1.15s forwards;
}
.nf-actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  flex-wrap: wrap;
  justify-content: center;
  opacity: 0;
  transform: translateY(12px);
  animation: enter-up 0.9s var(--ease-out-expo) 1.25s forwards;
}
.nf-btn {
  padding: 11px 26px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--btn-bg);
  color: var(--fg);
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
}
.nf-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--node-bg);
}
.nf-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
@media (max-width: 720px) {
  .nf-wrap { padding: 40px 16px; gap: 13px; }
  .nf-logo { width: 52px; height: 52px; }
  .nf-actions { gap: 10px; }
  .nf-divider { width: 200px !important; }
  .nf-seal { width: 68px; height: 68px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01s !important;
    animation-delay: 0s !important;
    transition-duration: 0.12s !important;
  }
  .nf-logo, .nf-eyebrow, .nf-code, .nf-title, .nf-sub, .nf-en, .nf-actions, .nf-seal {
    opacity: 1 !important;
    transform: none !important;
  }
  .nf-divider { width: 260px !important; }
  .nf-curtain { display: none !important; }
}
</style>
</head>
<body>
<div class="nf-curtain top" aria-hidden="true"></div>
<div class="nf-curtain bottom" aria-hidden="true"></div>
<div id="bg-host"></div>
<button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
    <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
    <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>

</button>
<main class="nf-wrap">
  <span class="nf-seal" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="24" cy="24" r="21"/><circle cx="24" cy="24" r="16" stroke-dasharray="2 3.2" opacity="0.6"/><circle cx="24" cy="24" r="7"/><polygon points="24,5 40.5,33.5 7.5,33.5"/><polygon points="24,43 7.5,14.5 40.5,14.5"/><path d="M24 1.5v2.4M24 44.1v2.4M1.5 24h2.4M44.1 24h2.4"/></svg></span>
  <img class="nf-logo" src="nnk_box.webp" alt="大魔女图书馆">
  <p class="nf-eyebrow">Manosaba Library · Records &amp; Rules</p>
  <h1 class="nf-code" aria-label="页面未找到 · 404"><span aria-hidden="true">404</span></h1>
  <h2 class="nf-title">查无此卷</h2>
  <p class="nf-sub">这份卷宗不在图书馆的目录之中——也许它从未被写下，也许它已被审判归档。返回书架，或向意见箱报告这条缺失的记录。</p>
  <p class="nf-en">No such archive.</p>
  <div class="nf-divider"></div>
  <div class="nf-actions">
    <a class="nf-btn" href="index.html">← 返回首页</a>
    <button class="nf-btn" type="button" onclick="window.open('https://github.com/QwQSakuya/Manosaba-Library/issues/new','_blank','noopener,noreferrer')">意见箱</button>
  </div>
</main>
<script src="assets/shared.js?v=20260816b"></script>
<script src="assets/lib/gsap.min.js?v=20260905a"></script>
<script src="assets/lib/ScrollTrigger.min.js?v=20260905a"></script>
<script src="assets/gsap-animations.js?v=20260905a"></script>
<script>
MS.restoreTheme();
MS.injectBgLayer('bg-host');
MS.initTheme();
MS.hideSplash(0);
(function () {
  var top = document.querySelector('.nf-curtain.top');
  var bot = document.querySelector('.nf-curtain.bottom');
  var seal = document.querySelector('.nf-seal');
  function open() {
    if (top) top.remove();
    if (bot) bot.remove();
  }
  if (!window.gsap) { open(); return; }
  gsap.registerPlugin(ScrollTrigger);
  gsap.fromTo(seal,
    { scale: 2.4, autoAlpha: 0, rotation: -14 },
    { scale: 1, autoAlpha: 0.85, rotation: 0, duration: 0.7, ease: 'back.out(1.7)', delay: 0.15 }
  );
  gsap.timeline({ onComplete: open })
    .to(top, { yPercent: -100, duration: 0.9, ease: 'power4.inOut' }, 0)
    .to(bot, { yPercent: 100, duration: 0.9, ease: 'power4.inOut' }, 0);
  setTimeout(open, 3000);
})();
</script>
</body>
