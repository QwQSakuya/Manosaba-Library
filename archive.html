<head>
<meta charset="UTF-8">

<script>
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
<style>
/* ── 全素材库专属样式 ── */
.archive-meta {
  margin: 0 0 18px;
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.06em;
  color: var(--fg3);
}
.archive-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 14px;
}
.archive-search {
  flex: 1 1 220px;
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-bg);
  color: var(--fg);
  font-size: 13px;
  letter-spacing: 0.04em;
  outline: none;
}
.archive-search:focus {
  border-color: var(--accent);
}
.archive-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.archive-table th,
.archive-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.archive-table th {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--fg3);
  font-size: 12px;
}
.archive-table td.arc-path {
  word-break: break-all;
  color: var(--fg2);
  font-size: 12px;
}
.archive-table td.arc-size {
  white-space: nowrap;
  color: var(--fg3);
}
.arc-type {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--fg2);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.arc-dl {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--fg);
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 0.06em;
  transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
  white-space: nowrap;
}
.arc-dl:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--panel-bg);
}
.arc-dl svg {
  width: 13px;
  height: 13px;
}
.arc-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 18px;
}
.arc-pager button {
  padding: 7px 18px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-bg);
  color: var(--fg);
  cursor: pointer;
  font-size: 13px;
  letter-spacing: 0.08em;
  transition: border-color 0.25s ease, color 0.25s ease;
}
.arc-pager button:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}
.arc-pager button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.arc-page-info {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 14px;
  color: var(--fg3);
  letter-spacing: 0.1em;
}
.arc-note {
  text-align: center;
  color: var(--fg3);
  font-size: 13px;
  padding: 30px 10px;
}
@media (max-width: 720px) {
  .archive-table th:nth-child(2),
  .archive-table td:nth-child(2) { display: none; }
}
</style>
</head>
<body>

<header class="c-header">
