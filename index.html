<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大魔女图书馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<script>
  // 主题恢复 (提前执行, 避免 FOUC 闪白)
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
<style>
/* ═══════════════════════════════════════════════════
   落地页专属样式 — 暗黑哥特 / 魔法审判意象
   变量 / reset / bg-layer / theme-toggle / splash / toast
   已迁入 shared.css, 此处仅保留卡片与布局
   ═══════════════════════════════════════════════════ */

body { display: block; }

/* ── 主体布局 ── */
.landing {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 88px 24px 56px;
  gap: 52px;
}

/* ── 标题区 ── */
.landing-header {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.logo {
  width: 76px;
  height: 76px;
  border-radius: 16px;
  object-fit: cover;
  border: 1px solid var(--border);
  box-shadow: 0 6px 28px rgba(0,0,0,0.18), 0 0 0 4px var(--bg);
  opacity: 0;
  transform: scale(0.65);
  animation: enter-logo 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
}
.landing-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: clamp(28px, 5vw, 46px);
  letter-spacing: 0.14em;
  color: var(--fg);
  margin: 0;
  line-height: 1.2;
  opacity: 0;
  transform: translateY(18px);
  animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
}
.landing-subtitle {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(14px, 2vw, 19px);
  letter-spacing: 0.28em;
  color: var(--fg2);
  margin: 0;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(12px);
  animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
}
.landing-divider {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--fg3), transparent);
  margin-top: 10px;
  animation: enter-divider 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.78s forwards;
}
@keyframes enter-logo    { to { opacity: 1; transform: scale(1); } }

/* ── 周目卡片容器 ── */
.cards {
  display: flex;
  gap: 34px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: stretch;
  width: 100%;
  max-width: 900px;
}

/* ── 周目卡片 ── */
.card {
  position: relative;
  flex: 1 1 340px;
  max-width: 420px;
  min-height: 390px;
  padding: 38px 34px 32px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--panel-bg);
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(30px);
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.45s ease;
  will-change: transform;
}
.card-act01 { animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.98s forwards; }
.card-act02 { animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 1.18s forwards; }

/* 卡片角色色系背景渐变 */
.card-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: 0.55;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
.card-act01 .card-bg {
  background:
    linear-gradient(155deg, hsla(340, 60%, 55%, 0.07) 0%, transparent 52%),
    linear-gradient(335deg, hsla(200, 65%, 60%, 0.06) 0%, transparent 62%);
}
.card-act02 .card-bg {
  background:
    linear-gradient(155deg, hsla(0, 65%, 55%, 0.07) 0%, transparent 52%),
    linear-gradient(335deg, hsla(30, 80%, 55%, 0.06) 0%, transparent 62%);
}
[data-theme="dark"] .card-act01 .card-bg {
  background:
    linear-gradient(155deg, hsla(340, 60%, 48%, 0.12) 0%, transparent 52%),
    linear-gradient(335deg, hsla(200, 65%, 50%, 0.09) 0%, transparent 62%);
}
[data-theme="dark"] .card-act02 .card-bg {
  background:
    linear-gradient(155deg, hsla(0, 65%, 48%, 0.12) 0%, transparent 52%),
    linear-gradient(335deg, hsla(30, 80%, 50%, 0.09) 0%, transparent 62%);
}

/* 卡片内蝴蝶装饰 (hover 显现) */
.card-butterfly {
  position: absolute;
  bottom: -14px;
  right: -12px;
  width: 96px;
  color: var(--fg);
  opacity: 0.04;
  transform: rotate(-18deg);
  transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.card:hover .card-butterfly {
  opacity: 0.13;
  transform: rotate(-6deg) translateY(-10px);
}
.card-act01 .card-butterfly { color: hsl(340, 60%, 55%); }
.card-act02 .card-butterfly { color: hsl(0, 65%, 55%); }
[data-theme="dark"] .card-act01 .card-butterfly { color: hsl(340, 55%, 62%); }
[data-theme="dark"] .card-act02 .card-butterfly { color: hsl(0, 60%, 62%); }

/* 哥特角线装饰 */
.card::before, .card::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border: 1px solid var(--fg3);
  opacity: 0.4;
  transition: opacity 0.45s ease, border-color 0.45s ease, width 0.45s ease, height 0.45s ease;
  pointer-events: none;
  z-index: 2;
}
.card::before { top: 9px; left: 9px; border-right: none; border-bottom: none; }
.card::after  { bottom: 9px; right: 9px; border-left: none; border-top: none; }
.card-act01:hover::before, .card-act01:hover::after { border-color: hsl(340, 60%, 55%); }
.card-act02:hover::before, .card-act02:hover::after { border-color: hsl(0, 65%, 55%); }
[data-theme="dark"] .card-act01:hover::before, [data-theme="dark"] .card-act01:hover::after { border-color: hsl(340, 55%, 62%); }
[data-theme="dark"] .card-act02:hover::before, [data-theme="dark"] .card-act02:hover::after { border-color: hsl(0, 60%, 62%); }
.card:hover::before, .card:hover::after { opacity: 0.75; width: 26px; height: 26px; }

/* 卡片内容 */
.card-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}
.card-num {
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  font-style: italic;
  font-size: 52px;
  line-height: 1;
  letter-spacing: 0.02em;
  opacity: 0.88;
}
.card-act01 .card-num { color: hsl(340, 60%, 55%); }
.card-act02 .card-num { color: hsl(0, 65%, 55%); }
[data-theme="dark"] .card-act01 .card-num { color: hsl(340, 55%, 64%); }
[data-theme="dark"] .card-act02 .card-num { color: hsl(0, 60%, 64%); }

.card-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 30px;
  letter-spacing: 0.12em;
  color: var(--fg);
  margin: 0;
}
.card-subtitle {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 17px;
  letter-spacing: 0.1em;
  margin: 0;
}
.card-act01 .card-subtitle { color: hsl(340, 42%, 48%); }
.card-act02 .card-subtitle { color: hsl(0, 48%, 48%); }
[data-theme="dark"] .card-act01 .card-subtitle { color: hsl(340, 48%, 66%); }
[data-theme="dark"] .card-act02 .card-subtitle { color: hsl(0, 52%, 66%); }

.card-stats {
  display: flex;
  gap: 28px;
  margin: 10px 0 6px;
  padding: 14px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.stat { display: flex; flex-direction: column; gap: 3px; }
.stat-num {
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  font-size: 28px;
  line-height: 1;
  color: var(--fg);
}
.stat-label {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--fg3);
}

.card-desc {
  font-size: 14px;
  line-height: 1.78;
  color: var(--fg2);
  margin: 0;
  flex: 1;
}

/* 进入按钮 */
.card-enter {
  align-self: flex-start;
  margin-top: 14px;
  padding: 11px 30px;
  border: 1px solid;
  border-radius: 2px;
  background: transparent;
  font-family: "Noto Serif SC", serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.3em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color 0.35s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.35s ease;
}
.card-enter::before {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: -1;
  opacity: 0.14;
}
.card-enter:hover::before { transform: scaleX(1); }
.card-enter:hover { color: var(--fg); }
.card-act01 .card-enter { color: hsl(340, 60%, 55%); border-color: hsla(340, 60%, 55%, 0.42); }
.card-act02 .card-enter { color: hsl(0, 65%, 55%); border-color: hsla(0, 65%, 55%, 0.42); }
[data-theme="dark"] .card-act01 .card-enter { color: hsl(340, 55%, 64%); border-color: hsla(340, 55%, 64%, 0.42); }
[data-theme="dark"] .card-act02 .card-enter { color: hsl(0, 60%, 64%); border-color: hsla(0, 60%, 64%, 0.42); }
[data-theme="dark"] .card-act01 .card-enter:hover { color: hsl(340, 60%, 80%); }
[data-theme="dark"] .card-act02 .card-enter:hover { color: hsl(0, 65%, 80%); }

/* 卡片 hover */
.card:hover { transform: translateY(-7px); }
.card-act01:hover {
  border-color: hsla(340, 60%, 55%, 0.5);
  box-shadow: 0 14px 44px hsla(340, 60%, 38%, 0.16);
}
.card-act02:hover {
  border-color: hsla(0, 65%, 55%, 0.5);
  box-shadow: 0 14px 44px hsla(0, 65%, 38%, 0.16);
}
[data-theme="dark"] .card-act01:hover {
  border-color: hsla(340, 55%, 62%, 0.48);
  box-shadow: 0 14px 44px hsla(340, 55%, 28%, 0.28);
}
[data-theme="dark"] .card-act02:hover {
  border-color: hsla(0, 60%, 62%, 0.48);
  box-shadow: 0 14px 44px hsla(0, 60%, 28%, 0.28);
}
.card:hover .card-bg { opacity: 0.85; }

/* ═══ 未来功能分隔线 ═══ */
.future-divider {
  width: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--fg3), transparent);
  opacity: 0.4;
  animation: enter-divider 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.35s forwards;
}

/* ═══ 未来功能区域 ═══ */
.future-section {
  width: 100%;
  max-width: 900px;
  opacity: 0;
  animation: enter-up 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.4s forwards;
}
.future-heading {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.24em;
  color: var(--fg3);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 20px;
}

/* ── 封锁卡片网格 ── */
.future-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

/* ── 封锁卡片 ── */
.future-card {
  position: relative;
  padding: 24px 14px 18px;
  border: 1.5px dashed var(--fg3);
  border-radius: 3px;
  background: var(--panel-bg);
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  opacity: 0.55;
  transition: opacity 0.4s ease,
              transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.4s ease;
}
.future-card:hover, .future-card:focus-visible {
  opacity: 0.82;
  transform: translateY(-3px);
  border-color: var(--accent);
  outline: none;
}
.future-card .fc-lock {
  position: absolute;
  top: 9px; right: 9px;
  width: 15px; height: 15px;
  color: var(--fg3);
  opacity: 0.5;
  flex-shrink: 0;
}
.future-card .fc-num {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 700;
  font-size: 30px;
  line-height: 1;
  color: var(--fg3);
  letter-spacing: 0.02em;
}
.future-card .fc-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.1em;
  color: var(--fg2);
}
.future-card .fc-sub {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fg3);
  text-transform: uppercase;
}
.future-card .fc-tag {
  margin-top: 6px;
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--fg3);
  background: var(--bg2);
}
.future-card .fc-butterfly {
  position: absolute;
  bottom: -10px;
  right: -8px;
  width: 52px;
  color: var(--fg);
  opacity: 0.03;
  transform: rotate(-18deg);
  transition: opacity 0.5s ease;
  pointer-events: none;
}
.future-card:hover .fc-butterfly { opacity: 0.08; }

/* ── 解锁卡片 ── */
.future-card.unlocked {
  border: 1px solid var(--border);
  opacity: 1;
  cursor: pointer;
}
.future-card.unlocked .fc-num { color: var(--accent); }
.future-card.unlocked .fc-tag { display: none; }
.future-card.unlocked .fc-go {
  display: inline-block;
  color: var(--accent);
  border-color: var(--accent);
  letter-spacing: 0.08em;
}
.future-card.unlocked:hover {
  border-color: var(--accent);
  box-shadow: 0 10px 30px rgba(0,0,0,0.10);
  opacity: 1;
}
.future-card.unlocked:hover .fc-butterfly { opacity: 0.12; }

@media (max-width: 720px) {
  .future-cards { grid-template-columns: repeat(2, 1fr); gap: 12px; }
}

/* ── 页脚 ── */
.landing-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 28px 24px;
  opacity: 0;
  animation: enter-up 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.55s forwards;
}
.landing-footer a {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 15px;
  letter-spacing: 0.16em;
  color: var(--fg3);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color 0.25s ease, border-bottom-color 0.25s ease;
  padding-bottom: 3px;
}
.landing-footer a:hover {
  color: var(--fg);
  border-bottom-color: var(--fg3);
}

/* ── 响应式 ── */
@media (max-width: 720px) {
  .landing { padding: 70px 16px 40px; gap: 40px; }
  .cards { flex-direction: column; max-width: 380px; gap: 24px; }
  .card { max-width: none; min-height: 0; }
  .logo { width: 64px; height: 64px; }
  .card-num { font-size: 44px; }
  .card-title { font-size: 26px; }
}

/* ── 减少动效偏好 ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01s !important;
    animation-delay: 0s !important;
    transition-duration: 0.12s !important;
  }
  .logo, .landing-title, .landing-subtitle, .card, .future-section, .landing-footer { opacity: 1 !important; transform: none !important; }
  .landing-divider, .future-divider { width: 260px !important; }
}
</style>
</head>
<body>

<!-- ═══ 背景装饰层 (内联 SVG 作为 JS 不可用时的降级) ═══ -->
<div class="bg-layer" aria-hidden="true">
  <div class="bg-gradient"></div>
  <div class="bg-blood"></div>
  <div class="bg-grain"></div>

  <!-- 大魔法阵: 同心圆 + 12 放射线 + 六芒星 + 五边形 -->
  <svg class="magic-circle" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

        <line x1="300" y1="8"   x2="300" y2="592"/>

        <line x1="508" y1="92"  x2="92"  y2="508"/>
        <line x1="160" y1="35"  x2="440" y2="565"/>
        <line x1="440" y1="35"  x2="160" y2="565"/>
        <line x1="35"  y1="160" x2="565" y2="440"/>
        <line x1="565" y1="160" x2="35"  y2="440"/>
      </g>
      <polygon points="300,75 480,393 120,393" stroke-width="0.7"/>
      <polygon points="300,525 120,207 480,207" stroke-width="0.7"/>
      <polygon points="300,140 433,237 382,395 218,395 167,237" stroke-width="0.5"/>
      <circle cx="300" cy="8"   r="2.5" fill="currentColor"/>
      <circle cx="300" cy="592" r="2.5" fill="currentColor"/>
      <circle cx="8"   cy="300" r="2.5" fill="currentColor"/>
      <circle cx="592" cy="300" r="2.5" fill="currentColor"/>
    </g>
  </svg>

  <!-- 小魔法阵 (反向旋转) -->
  <svg class="magic-circle-inner" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="200" cy="200" r="192" stroke-width="0.6"/>

  </svg>

  <!-- 蝴蝶 ×4 -->

(function () {
  // 主题切换
  MS.initTheme();

  // 周目卡片跳转: 点击或 Enter/Space
  document.querySelectorAll('[data-go]').forEach(function (el) {
    var go = function () {
      var target = el.dataset.go;
      if (target) location.href = target + '.html';
    };
    el.addEventListener('click', go);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        go();
      }
    });
  });
})();
</script>
