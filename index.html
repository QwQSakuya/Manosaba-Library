<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔女审判文本查询器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
  // 主题恢复 (提前执行, 避免 FOUC 闪白)
  // 注: 落地页不引入 app.js —— app.js 顶层即访问 canvas-container 等 DOM,
  // 在无画布的落地页会抛 TypeError 中断; 主题逻辑按任务允许方案在此自行实现.
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
<style>
/* ═══════════════════════════════════════════════════
   落地页专属样式 — 暗黑哥特 / 魔法审判意象
   仅此页使用, 不外置到共享 style.css
   ═══════════════════════════════════════════════════ */

/* ── 覆盖 style.css 的全屏工具页布局 ── */
html, body {
  height: auto;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
}
body {
  display: block;
  position: relative;
  background: var(--bg);
  color: var(--fg);
}

/* ── 背景装饰层 (固定, 不随滚动) ── */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

/* 多层径向渐变营造审判庭氛围 */
.bg-gradient {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 18% 22%, hsla(340, 55%, 30%, 0.12), transparent 60%),
    radial-gradient(ellipse 70% 55% at 84% 78%, hsla(0, 60%, 28%, 0.10), transparent 60%),
    radial-gradient(ellipse 60% 80% at 50% 112%, hsla(280, 45%, 24%, 0.08), transparent 70%);
}
[data-theme="dark"] .bg-gradient {
  background:
    radial-gradient(ellipse 80% 60% at 18% 22%, hsla(340, 65%, 22%, 0.22), transparent 60%),
    radial-gradient(ellipse 70% 55% at 84% 78%, hsla(0, 70%, 20%, 0.20), transparent 60%),
    radial-gradient(ellipse 60% 80% at 50% 112%, hsla(280, 50%, 16%, 0.18), transparent 70%);
}

/* 血迹溅射 (CSS radial-gradient 模拟) */
.bg-blood {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 12% 78%, hsla(0, 75%, 28%, 0.07) 0%, transparent 6%),
    radial-gradient(circle at 88% 22%, hsla(340, 65%, 32%, 0.06) 0%, transparent 5%),
    radial-gradient(circle at 65% 88%, hsla(0, 70%, 25%, 0.05) 0%, transparent 7%),
    radial-gradient(circle at 28% 14%, hsla(340, 55%, 30%, 0.04) 0%, transparent 4%),
    radial-gradient(circle at 92% 55%, hsla(0, 65%, 28%, 0.04) 0%, transparent 3.5%);
}
[data-theme="dark"] .bg-blood {
  background:
    radial-gradient(circle at 12% 78%, hsla(0, 80%, 22%, 0.12) 0%, transparent 6%),
    radial-gradient(circle at 88% 22%, hsla(340, 70%, 25%, 0.10) 0%, transparent 5%),
    radial-gradient(circle at 65% 88%, hsla(0, 75%, 20%, 0.09) 0%, transparent 7%),
    radial-gradient(circle at 28% 14%, hsla(340, 60%, 24%, 0.07) 0%, transparent 4%),
    radial-gradient(circle at 92% 55%, hsla(0, 70%, 22%, 0.07) 0%, transparent 3.5%);
}

/* 噪点纹理 (SVG turbulence 内联) */
.bg-grain {
  position: absolute;
  inset: 0;
  opacity: 0.028;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ── 魔法阵 (同心圆 + 放射线 + 六芒星, 低透明度旋转) ── */
.magic-circle {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(920px, 125vw);
  height: min(920px, 125vw);
  transform: translate(-50%, -50%);
  color: var(--fg);
  opacity: 0.05;
  animation: spin 180s linear infinite;
  will-change: transform;
}
.magic-circle-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(520px, 72vw);
  height: min(520px, 72vw);
  transform: translate(-50%, -50%);
  color: var(--fg);
  opacity: 0.04;
  animation: spin-rev 130s linear infinite;
  will-change: transform;
}
[data-theme="dark"] .magic-circle { opacity: 0.075; }
[data-theme="dark"] .magic-circle-inner { opacity: 0.06; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes spin-rev { to { transform: translate(-50%, -50%) rotate(-360deg); } }

/* ── 蝴蝶 (死亡讯息意象, SVG path) ── */
.butterfly {
  position: absolute;
  color: var(--fg);
  opacity: 0.10;
  will-change: transform;
}
[data-theme="dark"] .butterfly { opacity: 0.14; }
.butterfly-1 { top: 11%; left: 7%; width: 58px; animation: flutter-a 9s ease-in-out infinite alternate; }
.butterfly-2 { top: 64%; right: 9%; width: 74px; animation: flutter-b 11s ease-in-out infinite alternate; }
.butterfly-3 { bottom: 16%; left: 14%; width: 50px; animation: flutter-c 8s ease-in-out infinite alternate; }
.butterfly-4 { top: 28%; right: 16%; width: 42px; opacity: 0.07; animation: flutter-a 10s ease-in-out infinite alternate-reverse; }
@keyframes flutter-a {
  0%   { transform: translateY(0) rotate(-8deg); }
  50%  { transform: translateY(-14px) translateX(8px) rotate(2deg); }
  100% { transform: translateY(-26px) rotate(7deg); }
}
@keyframes flutter-b {
  0%   { transform: translateY(0) rotate(5deg); }
  100% { transform: translateY(-22px) translateX(-12px) rotate(-6deg); }
}
@keyframes flutter-c {
  0%   { transform: translateY(0) rotate(-3deg); }
  100% { transform: translateY(-18px) translateX(6px) rotate(5deg); }
}

/* ── 主题切换按钮 (右上角) ── */
.theme-toggle {
  position: fixed;
  top: 22px;
  right: 26px;
  z-index: 50;
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--header-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--fg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.3s ease, box-shadow 0.3s ease;
}
.theme-toggle:hover {
  border-color: var(--accent);
  transform: rotate(18deg);
  box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-moon { display: block; }
.theme-toggle .icon-sun  { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun  { display: block; }

/* ── 主体布局 ── */
.landing {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 88px 24px 56px;
  gap: 52px;
}

/* ── 标题区 ── */
.landing-header {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.logo {
  width: 76px;
  height: 76px;
  border-radius: 16px;
  object-fit: cover;
  border: 1px solid var(--border);
  box-shadow: 0 6px 28px rgba(0,0,0,0.18), 0 0 0 4px var(--bg);
  opacity: 0;
  transform: scale(0.65);
  animation: enter-logo 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
}
.landing-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: clamp(28px, 5vw, 46px);
  letter-spacing: 0.14em;
  color: var(--fg);
  margin: 0;
  line-height: 1.2;
  opacity: 0;
  transform: translateY(18px);
  animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
}
.landing-subtitle {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(14px, 2vw, 19px);
  letter-spacing: 0.28em;
  color: var(--fg2);
  margin: 0;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(12px);
  animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
}
.landing-divider {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--fg3), transparent);
  margin-top: 10px;
  animation: enter-divider 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.78s forwards;
}
@keyframes enter-logo    { to { opacity: 1; transform: scale(1); } }
@keyframes enter-up      { to { opacity: 1; transform: translateY(0); } }
@keyframes enter-divider { to { width: 260px; } }

/* ── 卡片容器 ── */
.cards {
  display: flex;
  gap: 34px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: stretch;
  width: 100%;
  max-width: 900px;
}

/* ── 周目卡片 ── */
.card {
  position: relative;
  flex: 1 1 340px;
  max-width: 420px;
  min-height: 390px;
  padding: 38px 34px 32px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--panel-bg);
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(30px);
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.45s ease;
  will-change: transform;
}
.card-act01 { animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.98s forwards; }
.card-act02 { animation: enter-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) 1.18s forwards; }

/* 卡片角色色系背景渐变 */
.card-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: 0.55;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
.card-act01 .card-bg {
  background:
    linear-gradient(155deg, hsla(340, 60%, 55%, 0.07) 0%, transparent 52%),
    linear-gradient(335deg, hsla(200, 65%, 60%, 0.06) 0%, transparent 62%);
}
.card-act02 .card-bg {
  background:
    linear-gradient(155deg, hsla(0, 65%, 55%, 0.07) 0%, transparent 52%),
    linear-gradient(335deg, hsla(30, 80%, 55%, 0.06) 0%, transparent 62%);
}
[data-theme="dark"] .card-act01 .card-bg {
  background:
    linear-gradient(155deg, hsla(340, 60%, 48%, 0.12) 0%, transparent 52%),
    linear-gradient(335deg, hsla(200, 65%, 50%, 0.09) 0%, transparent 62%);
}
[data-theme="dark"] .card-act02 .card-bg {
  background:
    linear-gradient(155deg, hsla(0, 65%, 48%, 0.12) 0%, transparent 52%),
    linear-gradient(335deg, hsla(30, 80%, 50%, 0.09) 0%, transparent 62%);
}

/* 卡片内蝴蝶装饰 (hover 显现) */
.card-butterfly {
  position: absolute;
  bottom: -14px;
  right: -12px;
  width: 96px;
  color: var(--fg);
  opacity: 0.04;
  transform: rotate(-18deg);
  transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.card:hover .card-butterfly {
  opacity: 0.13;
  transform: rotate(-6deg) translateY(-10px);
}
.card-act01 .card-butterfly { color: hsl(340, 60%, 55%); }
.card-act02 .card-butterfly { color: hsl(0, 65%, 55%); }
[data-theme="dark"] .card-act01 .card-butterfly { color: hsl(340, 55%, 62%); }
[data-theme="dark"] .card-act02 .card-butterfly { color: hsl(0, 60%, 62%); }

/* 哥特角线装饰 */
.card::before, .card::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border: 1px solid var(--fg3);
  opacity: 0.4;
  transition: opacity 0.45s ease, border-color 0.45s ease, width 0.45s ease, height 0.45s ease;
  pointer-events: none;
  z-index: 2;
}
.card::before { top: 9px; left: 9px; border-right: none; border-bottom: none; }
.card::after  { bottom: 9px; right: 9px; border-left: none; border-top: none; }
.card-act01:hover::before, .card-act01:hover::after { border-color: hsl(340, 60%, 55%); }
.card-act02:hover::before, .card-act02:hover::after { border-color: hsl(0, 65%, 55%); }
[data-theme="dark"] .card-act01:hover::before, [data-theme="dark"] .card-act01:hover::after { border-color: hsl(340, 55%, 62%); }
[data-theme="dark"] .card-act02:hover::before, [data-theme="dark"] .card-act02:hover::after { border-color: hsl(0, 60%, 62%); }
.card:hover::before, .card:hover::after { opacity: 0.75; width: 26px; height: 26px; }

/* 卡片内容 */
.card-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}
.card-num {
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  font-style: italic;
  font-size: 52px;
  line-height: 1;
  letter-spacing: 0.02em;
  opacity: 0.88;
}
.card-act01 .card-num { color: hsl(340, 60%, 55%); }
.card-act02 .card-num { color: hsl(0, 65%, 55%); }
[data-theme="dark"] .card-act01 .card-num { color: hsl(340, 55%, 64%); }
[data-theme="dark"] .card-act02 .card-num { color: hsl(0, 60%, 64%); }

.card-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 30px;
  letter-spacing: 0.12em;
  color: var(--fg);
  margin: 0;
}
.card-subtitle {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 17px;
  letter-spacing: 0.1em;
  margin: 0;
}
.card-act01 .card-subtitle { color: hsl(340, 42%, 48%); }
.card-act02 .card-subtitle { color: hsl(0, 48%, 48%); }
[data-theme="dark"] .card-act01 .card-subtitle { color: hsl(340, 48%, 66%); }
[data-theme="dark"] .card-act02 .card-subtitle { color: hsl(0, 52%, 66%); }

.card-stats {
  display: flex;
  gap: 28px;
  margin: 10px 0 6px;
  padding: 14px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.stat { display: flex; flex-direction: column; gap: 3px; }
.stat-num {
  font-family: "Cormorant Garamond", serif;
  font-weight: 700;
  font-size: 28px;
  line-height: 1;
  color: var(--fg);
}
.stat-label {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--fg3);
}

.card-desc {
  font-size: 14px;
  line-height: 1.78;
  color: var(--fg2);
  margin: 0;
  flex: 1;
}

/* 进入按钮 */
.card-enter {
  align-self: flex-start;
  margin-top: 14px;
  padding: 11px 30px;
  border: 1px solid;
  border-radius: 2px;
  background: transparent;
  font-family: "Noto Serif SC", serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.3em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color 0.35s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.35s ease;
}
.card-enter::before {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: -1;
  opacity: 0.14;
}
.card-enter:hover::before { transform: scaleX(1); }
.card-enter:hover { color: var(--fg); }
.card-act01 .card-enter { color: hsl(340, 60%, 55%); border-color: hsla(340, 60%, 55%, 0.42); }
.card-act02 .card-enter { color: hsl(0, 65%, 55%); border-color: hsla(0, 65%, 55%, 0.42); }
[data-theme="dark"] .card-act01 .card-enter { color: hsl(340, 55%, 64%); border-color: hsla(340, 55%, 64%, 0.42); }
[data-theme="dark"] .card-act02 .card-enter { color: hsl(0, 60%, 64%); border-color: hsla(0, 60%, 64%, 0.42); }
[data-theme="dark"] .card-act01 .card-enter:hover { color: hsl(340, 60%, 80%); }
[data-theme="dark"] .card-act02 .card-enter:hover { color: hsl(0, 65%, 80%); }

/* 卡片 hover */
.card:hover { transform: translateY(-7px); }
.card-act01:hover {
  border-color: hsla(340, 60%, 55%, 0.5);
  box-shadow: 0 14px 44px hsla(340, 60%, 38%, 0.16);
}
.card-act02:hover {
  border-color: hsla(0, 65%, 55%, 0.5);
  box-shadow: 0 14px 44px hsla(0, 65%, 38%, 0.16);
}
[data-theme="dark"] .card-act01:hover {
  border-color: hsla(340, 55%, 62%, 0.48);
  box-shadow: 0 14px 44px hsla(340, 55%, 28%, 0.28);
}
[data-theme="dark"] .card-act02:hover {
  border-color: hsla(0, 60%, 62%, 0.48);
  box-shadow: 0 14px 44px hsla(0, 60%, 28%, 0.28);
}
.card:hover .card-bg { opacity: 0.85; }

/* ── 页脚 ── */
.landing-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 28px 24px;
  opacity: 0;
  animation: enter-up 0.85s cubic-bezier(0.22, 1, 0.36, 1) 1.45s forwards;
}
.landing-footer a {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 15px;
  letter-spacing: 0.16em;
  color: var(--fg3);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color 0.25s ease, border-bottom-color 0.25s ease;
  padding-bottom: 3px;
}
.landing-footer a:hover {
  color: var(--fg);
  border-bottom-color: var(--fg3);
}

/* ── 响应式 ── */
@media (max-width: 720px) {
  .landing { padding: 70px 16px 40px; gap: 40px; }
  .cards { flex-direction: column; max-width: 380px; gap: 24px; }
  .card { max-width: none; min-height: 0; }
  .theme-toggle { top: 14px; right: 14px; width: 38px; height: 38px; }
  .logo { width: 64px; height: 64px; }
  .card-num { font-size: 44px; }
  .card-title { font-size: 26px; }
}

/* ── 减少动效偏好 ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01s !important;
    animation-delay: 0s !important;
    transition-duration: 0.12s !important;
  }
  .magic-circle, .magic-circle-inner, .butterfly { animation: none !important; }
  .logo, .landing-title, .landing-subtitle, .card, .landing-footer { opacity: 1 !important; transform: none !important; }
  .landing-divider { width: 260px !important; }
}
</style>
</head>
<body>

<!-- ═══ 背景装饰层 ═══ -->
<div class="bg-layer" aria-hidden="true">
  <div class="bg-gradient"></div>
  <div class="bg-blood"></div>
  <div class="bg-grain"></div>

  <!-- 大魔法阵: 同心圆 + 12 放射线 + 六芒星 + 五边形 -->
  <svg class="magic-circle" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="300" cy="300" r="292" stroke-width="0.8"/>
      <circle cx="300" cy="300" r="278" stroke-width="0.4"/>
      <circle cx="300" cy="300" r="250" stroke-width="0.6"/>
      <circle cx="300" cy="300" r="200" stroke-width="0.5"/>
      <circle cx="300" cy="300" r="150" stroke-width="0.6"/>
      <circle cx="300" cy="300" r="100" stroke-width="0.5"/>
      <circle cx="300" cy="300" r="52"  stroke-width="0.8"/>
      <g stroke-width="0.35">
        <line x1="300" y1="8"   x2="300" y2="592"/>
        <line x1="8"   y1="300" x2="592" y2="300"/>
        <line x1="92"  y1="92"  x2="508" y2="508"/>
        <line x1="508" y1="92"  x2="92"  y2="508"/>
        <line x1="160" y1="35"  x2="440" y2="565"/>
        <line x1="440" y1="35"  x2="160" y2="565"/>
        <line x1="35"  y1="160" x2="565" y2="440"/>
        <line x1="565" y1="160" x2="35"  y2="440"/>
      </g>
      <polygon points="300,75 480,393 120,393" stroke-width="0.7"/>
      <polygon points="300,525 120,207 480,207" stroke-width="0.7"/>
      <polygon points="300,140 433,237 382,395 218,395 167,237" stroke-width="0.5"/>

<script>
// ═══════════════════════════════════════════════════
//  落地页专属 JS
//  主题恢复 IIFE 已在 <head> 提前执行 (防闪白)
//  此处: 主题切换绑定 + 卡片点击/键盘跳转
// ═══════════════════════════════════════════════════
(function () {
  // 主题切换 (复用 app.js 的逻辑, 持久化到 localStorage)
  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  }

  // 卡片跳转: 点击任意位置 (含按钮, 事件冒泡) 或 Enter/Space 触发
  document.querySelectorAll('[data-go]').forEach(function (el) {
    var go = function () {
      var target = el.dataset.go;
      if (target) location.href = target + '.html';
    };
    el.addEventListener('click', go);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        go();
      }
    });
  });
})();
</script>
