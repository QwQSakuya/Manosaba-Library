<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="语音和音乐：按场景与角色筛选语音，试听 BGM 与音效。">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<title>语音和音乐 — 大魔女图书馆</title>

<link rel="stylesheet" href="assets/shared.css?v=20260814a">
<link rel="stylesheet" href="assets/content.css?v=20260814a">
<script>
  // 主题恢复 (提前执行, 避免 FOUC 闪白)
  (function () {
    var s = localStorage.getItem('theme');
    if (s === 'dark' || s === 'light') {
      document.documentElement.setAttribute('data-theme', s);
    }
  })();
</script>
<style>
/* ═══════════════════════════════════════════════════
   语音和音乐页 — 专属样式
   依赖: shared.css (变量/bg/splash/toast) + content.css (c-header/c-main/gothic-frame/filterbar/mini-player/source-tag/char-dot/empty-state)
   ═══════════════════════════════════════════════════ */

/* ── 开屏：黑胶唱片旋转入场 ── */
@keyframes vinylSpin {
  from { transform: rotate(-180deg) scale(0.6); opacity: 0; }
  to   { transform: rotate(0deg) scale(1); opacity: 1; }
}
#splash-mark {
  animation: vinylSpin 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
}

/* ── 主体留白（避开固定 mini-player）── */
.c-main { padding-bottom: 110px; }

/* ── 区块间距 ── */
.audio-section { margin-bottom: 44px; }
.audio-section:last-child { margin-bottom: 0; }

/* ═══ SFX 区 ═══ */
.sfx-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.sfx-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 11px 18px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--btn-bg);
  color: var(--fg);
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
              background 0.25s ease, border-color 0.25s ease;
}
.sfx-btn:hover {
  background: var(--btn-hover);
  border-color: var(--accent);
  transform: translateY(-2px);
}
.sfx-btn .sfx-icon {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg2);
  flex-shrink: 0;
}
.sfx-btn .sfx-icon svg { width: 100%; height: 100%; }
/* 波形（播放时显现） */
.sfx-btn .sfx-wave {
  display: none;
  align-items: center;
  gap: 2px;
  height: 14px;
  width: 14px;
  flex-shrink: 0;
}
.sfx-btn .sfx-wave span {
  width: 2px;
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  transform-origin: center;
  animation: sfx-bar 0.9s ease-in-out infinite;
}
.sfx-btn .sfx-wave span:nth-child(1) { animation-delay: 0s; }
.sfx-btn .sfx-wave span:nth-child(2) { animation-delay: 0.15s; }
.sfx-btn .sfx-wave span:nth-child(3) { animation-delay: 0.30s; }
.sfx-btn .sfx-wave span:nth-child(4) { animation-delay: 0.45s; }
.sfx-btn .sfx-wave span:nth-child(5) { animation-delay: 0.60s; }
.sfx-btn .sfx-wave span:nth-child(6) { animation-delay: 0.75s; }
@keyframes sfx-bar {
  0%, 100% { transform: scaleY(0.22); }
  50%      { transform: scaleY(1); }
}
.sfx-btn.playing .sfx-icon { display: none; }
.sfx-btn.playing .sfx-wave { display: flex; }
.sfx-btn.playing {
  border-color: var(--accent);
  background: var(--btn-hover);
}
/* SFX 行内空状态 */
.sfx-empty {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 13px;
  color: var(--fg3);
  letter-spacing: 0.1em;
  padding: 6px 2px;
}

/* ═══ BGM 区 ═══ */
.bgm-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bgm-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.25s ease, background 0.25s ease;
}
.bgm-card:hover {
  border-color: var(--accent);
  transform: translateX(3px);
}
.bgm-card .bgm-cat {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fg3);
  text-transform: uppercase;
  min-width: 72px;
  flex-shrink: 0;
}
.bgm-card .bgm-name {
  flex: 1;
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bgm-card .bgm-play {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--btn-bg);
  color: var(--fg);
  font-size: 11px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s ease;
}
.bgm-card .bgm-play svg { width: 12px; height: 12px; }
.bgm-card .bgm-play:disabled { cursor: not-allowed; opacity: 0.4; }
.bgm-card:hover .bgm-play {
  border-color: var(--accent);
  background: var(--btn-hover);
}
.bgm-card.playing .bgm-play {
  background: var(--btn-active);
  color: var(--btn-active-fg);
  border-color: var(--btn-active);
}
/* 下载按钮: 与播放按钮成对, 复用圆形视觉 */
.bgm-card .bgm-dl {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--btn-bg);
  color: var(--fg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  text-decoration: none;
  transition: all 0.2s ease;
}
.bgm-card .bgm-dl svg { width: 14px; height: 14px; }
.bgm-card:hover .bgm-dl {
  border-color: var(--accent);
  background: var(--btn-hover);
  color: var(--accent);
}
.bgm-card.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.bgm-card.disabled:hover { transform: none; border-color: var(--border); }

/* ═══ 语音区提示 ═══ */
.voice-note {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 13px;
  letter-spacing: 0.1em;
  color: var(--fg3);
  margin-bottom: 22px;
  padding: 10px 16px;
  border-left: 2px solid var(--border);
  background: var(--bg2);
  border-radius: 0 3px 3px 0;
  line-height: 1.6;
}

/* ═══ 筛选栏标签 ═══ */
.filterbar { margin-bottom: 14px; }
.filterbar .filter-label {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--fg3);
  text-transform: uppercase;
  margin-right: 8px;
  align-self: center;
}
.filterbar .chip .char-dot { margin-right: 5px; vertical-align: middle; }

/* ═══ 语音卡片 ═══ */
.voice-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.voice-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px 12px 22px;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.3s ease,
              box-shadow 0.3s ease,
              background 0.3s ease;
}
.voice-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
.voice-card .vc-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
}
.voice-card .vc-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.voice-card .vc-name {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.voice-card .vc-scene-line {
  display: flex;
  align-items: center;
  gap: 8px;
}
.voice-card .vc-duration {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 700;
  font-size: 15px;
  color: var(--fg3);
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.voice-card .vc-play {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--btn-bg);
  color: var(--fg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}
.voice-card .vc-play:hover {
  background: var(--btn-hover);
  border-color: var(--accent);
}
.voice-card .vc-play svg { width: 14px; height: 14px; }
.voice-card.active {
  border-color: var(--accent);
  background: var(--btn-hover);
}
.voice-card.active .vc-play {
  background: var(--btn-active);
  color: var(--btn-active-fg);
  border-color: var(--btn-active);
}

/* ═══ mini-player 黑胶图标 ═══ */
.mini-player .mp-disc svg { width: 22px; height: 22px; }

/* ═══ 空状态容器 ═══ */
.audio-empty { padding: 60px 20px; }

/* ═══ 减少动效 ═══ */
@media (prefers-reduced-motion: reduce) {
  #splash-mark { animation-duration: 0.01s !important; animation-delay: 0s !important; }
  .sfx-btn .sfx-wave span { animation: none !important; transform: scaleY(0.6); }
  .voice-card, .sfx-btn { transition-duration: 0.01s !important; }
}

/* ═══ 响应式 ═══ */
@media (max-width: 720px) {
  .voice-card { padding: 10px 12px 10px 18px; gap: 10px; }
  .voice-card .vc-duration { font-size: 13px; }
  .voice-card .vc-play { width: 30px; height: 30px; }
  .voice-card .vc-play svg { width: 12px; height: 12px; }
  .bgm-card .bgm-play,
  .bgm-card .bgm-dl { width: 30px; height: 30px; }
  .bgm-card .bgm-play svg,
  .bgm-card .bgm-dl svg { width: 12px; height: 12px; }
}
</style>
</head>
<body>

<!-- ═══ 开屏动画 ═══ -->
<div id="splash">
  <div id="splash-mark" aria-hidden="true">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="31" fill="#0d0d0d"/>
      <g fill="none" stroke="#3a3a3a" stroke-width="0.5">
        <circle cx="32" cy="32" r="27.5"/>
        <circle cx="32" cy="32" r="23.5"/>
        <circle cx="32" cy="32" r="19.5"/>
        <circle cx="32" cy="32" r="15.5"/>

      <circle cx="32" cy="32" r="11" fill="hsl(340, 55%, 42%)"/>
      <circle cx="32" cy="32" r="10" fill="none" stroke="hsl(340, 55%, 28%)" stroke-width="0.4"/>
      <circle cx="32" cy="32" r="2.2" fill="#0d0d0d"/>

  </div>

<div id="bg-host"></div>

<!-- ═══ 主题切换 ═══ -->
<button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
    <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
    <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
  </svg>
</button>

<!-- ═══ 头部 ═══ -->
<header class="c-header">
  <a href="index.html" class="nav-link">← 返回</a>
  <span class="c-title">语音和音乐</span>
  <span class="c-subtitle">Voice &amp; Music</span>
</header>

<!-- ═══ 主体 ═══ -->
<main class="c-main">

  <!-- SFX 区 -->
  <section class="audio-section">
    <h2 class="c-section-title">音效</h2>
    <div class="gothic-frame">
      <div class="sfx-grid" id="sfx-grid"></div>
    </div>
  </section>

  <!-- BGM 区 -->
  <section class="audio-section">
    <h2 class="c-section-title">音乐</h2>
    <div class="gothic-frame">
      <div class="bgm-list" id="bgm-list"></div>
    </div>
  </section>

  <!-- 语音区 -->
  <section class="audio-section">
    <h2 class="c-section-title">语音</h2>
    <div class="voice-note">完整语音库外部托管，此处为精选样本。</div>

    <!-- 场景筛选 -->
    <div class="filterbar" id="scene-filters"></div>
    <!-- 角色筛选 -->
    <div class="filterbar" id="char-filters"></div>

    <!-- 语音列表 -->
    <div class="voice-list" id="voice-list"></div>
  </section>

</main>

<!-- ═══ 共享音频元素 ═══ -->
<audio id="audio-player" preload="auto"></audio>

<!-- ═══ Mini Player ═══ -->
<div class="mini-player" id="mini-player">
  <div class="mp-disc" aria-hidden="true">

      <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.6"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4"/>
      <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
    </svg>
  </div>
  <div class="mp-info">
    <div class="mp-title" id="mp-title">—</div>
    <div class="mp-meta" id="mp-meta">—</div>
  </div>
  <div class="mp-progress" id="mp-progress">
    <div class="mp-progress-fill" id="mp-fill"></div>
  </div>
  <div class="mp-time" id="mp-time">0:00 / 0:00</div>
  <button class="mp-btn" id="mp-btn" aria-label="播放/暂停">
    <svg id="mp-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg id="mp-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
</div>
